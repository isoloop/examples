name: Comparison

# The recorded comparison: the size matrix (M3c task 12), each size on each
# build, and the one-chart-blocked scenario (M3b task 18), native and Isoloop,
# React and Preact, on Chromium, one test at a time. It runs on demand, after a
# `markets-v*` deploy (release.yml) and weekly (weekly.yml); its numbers and
# the side-by-side videos are uploaded as an artifact.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    # In the job, not the workflow: this one is also called from others.
    concurrency:
      group: comparison
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-browsers
        with:
          browsers: chromium
      # For the side-by-side video; without it, compare.ts writes the table only.
      - run: command -v ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm --filter ./apps/dashboards/markets compare
      - run: cat apps/dashboards/markets/comparison-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison
          path: apps/dashboards/markets/comparison-results
          retention-days: 90
