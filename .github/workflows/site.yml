name: Site

# The site's checks (ADR 0002, decision 11): build every app and the site,
# assemble them as deployed (with the site, SITE=1), check every internal link,
# then the Chromium smoke test against the assembled site: every page clean in
# the console under its policy, axe on every page and on ui's specimens, basic
# booting in the landing page's iframe and restarting a crashed isolate, and
# the theme switching the frames live.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site's build fetches the pinned diagrams and checks the pin is on
      # isoloop/isoloop's main (apps/site/build/library.ts).
      - run: pnpm --filter "./apps/dashboards/*" --filter ./apps/basic --filter ./apps/site build
      - run: pnpm --filter ui build:specimens
      - name: Assemble the site, with the site's pages
        run: SITE=1 scripts/assemble-site.sh site
      - run: pnpm --filter site linkcheck ../../site
      - uses: ./.github/actions/install-browsers
        with:
          browsers: chromium
      - run: pnpm --filter site smoke
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-site
          path: apps/site/playwright-report
          retention-days: 7
