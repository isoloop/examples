name: Release

# A `markets-v*` or `plant-v*` tag ships that public demo: check, every E2E
# test of that app on every build and engine, deploy (every dashboard, and the
# live smoke tests), then the recorded comparison of that app.
on:
  push:
    tags: ['markets-v*', 'plant-v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  e2e:
    needs: check
    uses: ./.github/workflows/e2e.yml
    with:
      # The tag's prefix names the app: plant-v0.1.0 -> dashboards/plant.
      apps: ${{ startsWith(github.ref_name, 'plant-v') && '["dashboards/plant"]' || '["dashboards/markets"]' }}
      scope: full

  deploy:
    needs: e2e
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  compare:
    needs: deploy
    if: startsWith(github.ref_name, 'markets-v')
    uses: ./.github/workflows/comparison.yml
