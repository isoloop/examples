# Ubuntu only, actions pinned by commit SHA (isoloop/isoloop ADR 0009, rules 9
# and 12). `check` runs on everything; `e2e` runs per app and engine, only for
# the apps a pull request touches (all of them when the shared setup changes,
# and on every push to main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - id: apps
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(ls apps)
          if [ -z "$BASE" ]; then
            apps="$all"
          else
            changed=$(git diff --name-only "$BASE" HEAD)
            if echo "$changed" | grep -qvE '^apps/'; then
              apps="$all"
            else
              apps=$(echo "$changed" | cut -d/ -f2 | sort -u)
            fi
          fi
          echo "apps=$(printf '%s\n' $apps | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  e2e:
    needs: check
    if: needs.check.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.check.outputs.apps) }}
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-browsers
        with:
          browsers: ${{ matrix.browser }}
      - run: pnpm --filter ./apps/${{ matrix.app }} e2e --project=${{ matrix.browser }}
      - run: pnpm --filter ./apps/${{ matrix.app }} e2e --project=${{ matrix.browser }}-load --workers=1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.app }}-${{ matrix.browser }}
          path: apps/${{ matrix.app }}/playwright-report
          retention-days: 7
