# Ubuntu only, actions pinned by commit SHA (isoloop/isoloop ADR 0009, rules 9
# and 12). `check` runs on everything; `e2e` runs per app and engine, only for
# the apps a pull request touches (all of them when the shared setup changes,
# none when only docs or Markdown change).
name: CI

# Pull requests: check, then E2E for the apps they touch (every build on
# Chromium, the React pair on Firefox and WebKit). Pushes to main: check only;
# the pull request already ran E2E. The site job (build, link check, smoke
# test) runs on both when the site's inputs change (ADR 0002, decision 11).
# Tags, releases and the weekly run are in release.yml and weekly.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: ./.github/workflows/check.yml

  e2e:
    needs: check
    if: github.event_name == 'pull_request' && needs.check.outputs.apps != '[]'
    uses: ./.github/workflows/e2e.yml
    with:
      apps: ${{ needs.check.outputs.apps }}
      scope: pr

  site:
    needs: check
    if: needs.check.outputs.site == 'true'
    uses: ./.github/workflows/site.yml
