name: E2E

# Playwright for the given apps, per engine. `scope: pr` runs every build on
# Chromium and the React pair only on Firefox and WebKit; `scope: full` runs
# every build everywhere, and adds the Heavy size (M3c decision 11). The
# `-load` project (timing under load) runs after the rest, one test at a time.
#
# Full scope is split into shards, each on its own runner, and runs one page at
# a time (--workers=1). An Isoloop page starts 20-30 workers; two or more such
# pages side by side on a 4-core runner made a different test flaky in each run
# (runs 42477672344, 42478292629). PR scope stays one job per engine.
on:
  workflow_call:
    inputs:
      apps:
        type: string
        required: true
      scope:
        type: string
        required: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.apps) }}
        browser: [chromium, firefox, webkit]
        shard: ${{ fromJSON(inputs.scope == 'pr' && '[1]' || '[1, 2, 3, 4]') }}
    env:
      SHARDS: ${{ inputs.scope == 'pr' && '1' || '4' }}
      WORKERS: ${{ inputs.scope == 'pr' && '' || '--workers=1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # An app id can hold a slash (dashboards/markets); artifact names can't.
      - run: echo "APP_SLUG=${APP//\//-}" >> "$GITHUB_ENV"
        env:
          APP: ${{ matrix.app }}
      - uses: ./.github/actions/install-browsers
        with:
          browsers: ${{ matrix.browser }}
      - run: pnpm --filter ./apps/${{ matrix.app }} e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ env.SHARDS }} ${{ env.WORKERS }} --pass-with-no-tests
        env:
          E2E_SCOPE: ${{ inputs.scope == 'pr' && matrix.browser != 'chromium' && 'react' || 'full' }}
          PERF_BUDGET_SCALE: '2'
          E2E_HEAVY: ${{ inputs.scope == 'pr' && '0' || '1' }}
      - run: pnpm --filter ./apps/${{ matrix.app }} e2e --project=${{ matrix.browser }}-load --workers=1 --shard=${{ matrix.shard }}/${{ env.SHARDS }} --pass-with-no-tests
        env:
          PERF_BUDGET_SCALE: '2'
          E2E_HEAVY: ${{ inputs.scope == 'pr' && '0' || '1' }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ env.APP_SLUG }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: apps/${{ matrix.app }}/playwright-report
          retention-days: 7
