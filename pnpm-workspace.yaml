packages:
  - apps/*
  # Apps grouped by kind, e.g. apps/dashboards/markets.
  - apps/dashboards/*
  # Shared workspace packages, e.g. packages/ui (ADR 0003).
  - packages/*

# Every version lives here, pinned exactly, as in isoloop/isoloop (ADR 0009,
# rule 8). Apps reference them with "catalog:".
catalog:
  '@playwright/test': 1.64.1
  '@types/node': 26.6.6
  oxfmt: 0.76.0
  oxlint: 1.91.0
  oxlint-tsgolint: 7.0.2005
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5
  zod: 4.6.7
  # packages/ui renders Preact components to static HTML at build time (ADR 0003).
  preact-render-to-string: 6.8.2
  # The site's smoke test checks accessibility with axe, behind expectAccessible() (ADR 0002, decision 9).
  '@axe-core/playwright': 4.14.0

# Isoloop itself, installed from npm like any app would. One version for every
# package (they release as one fixed group, ADR 0012), so all apps move to a
# new prerelease together. Until 0.1 these are `next` builds of
# isoloop/isoloop's main (its prerelease.yml); the lockfile pins them.
catalogs:
  isoloop:
    '@isoloop/bus': 0.0.0-next.b8ffdcf
    '@isoloop/codec': 0.0.0-next.b8ffdcf
    '@isoloop/host': 0.0.0-next.b8ffdcf
    '@isoloop/preact': 0.0.0-next.b8ffdcf
    '@isoloop/protocol': 0.0.0-next.b8ffdcf
    '@isoloop/react': 0.0.0-next.b8ffdcf
    '@isoloop/runtime': 0.0.0-next.b8ffdcf
    '@isoloop/vite': 0.0.0-next.b8ffdcf
  react:
    react: 19.3.1
    react-dom: 19.3.1
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
  # The Preact builds (M3b task 16b): the same widgets through preact/compat.
  preact:
    preact: 11.1.1

# Supply chain, as in isoloop/isoloop (ADR 0009, rule 9), except for our own
# packages: a prerelease is used the day it's published.
minimumReleaseAge: 4320 # minutes: refuse versions younger than 3 days
minimumReleaseAgeExclude:
  - '@isoloop/*'
strictPeerDependencies: true
strictDepBuilds: true
